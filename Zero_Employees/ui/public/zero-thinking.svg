<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="-1.00 -1.00 26.00 26.00"
     style="transform-origin:50% 50%;">
  <style>
    /* 56.549 is the circumference of the r=9 ring (2*pi*r). The keyframes
       draw it on and then off again, so the dash length must match the
       geometry exactly or the stroke stalls short of a full revolution. */
    @keyframes draw {
      0%       { stroke-dasharray:0.000 56.549; stroke-dashoffset:-56.549; opacity:1; animation-timing-function:cubic-bezier(0.455, 0.03, 0.515, 0.955); }
      39.0625% { stroke-dasharray:56.549 56.549; stroke-dashoffset:0.000; opacity:1; animation-timing-function:cubic-bezier(0.55, 0.055, 0.675, 0.19); }
      78.1250% { stroke-dasharray:0.000 56.549; stroke-dashoffset:0.000; opacity:1; }
      78.2250% { opacity:0; }
      100%     { stroke-dasharray:0.000 56.549; stroke-dashoffset:0.000; opacity:0; }
    }
    .p { animation: draw 1s linear infinite; }
  </style>
  <circle class="p" cx="12" cy="12" r="9" fill="none" stroke="#ffffff"
          stroke-width="2" stroke-linecap="round" transform="rotate(-90 12 12)"/>
</svg>
