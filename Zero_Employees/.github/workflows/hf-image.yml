name: Hugging Face image

# Builds the production image (amd64) and publishes it as
# ghcr.io/<owner>/<repo>:hf for the Hugging Face Space in deploy/huggingface.
# If the HF_TOKEN and HF_SPACE secrets are set, the Space is restarted so it
# pulls the new image.
on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions: {}

concurrency:
  group: hf-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ secrets.HF_SPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh lockfile for Docker build context
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/share/boost /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:hf
            ${{ steps.image.outputs.name }}:hf-${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-hf
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-hf,mode=max

      - name: Restart Hugging Face Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${HF_SPACE}/restart?factory=true"
